# Publishes the Loot Comets addon (lootcomets/) to CurseForge and Wago. Only by hand, after changing its code:
#   Actions → "Loot Comets release" → Run workflow
#
# Each run: tests, a staged copy tagged with lootcomets/VERSION (tools/lootcomets-release.sh), then the BigWigs
# packager zips it and uploads it. Same secrets as the Forever Anvil release: CF_API_KEY, WAGO_API_TOKEN.
# Project ids are in lootcomets/LootComets/LootComets.toc (X-Curse-Project-ID, X-Wago-ID); a site without one
# is skipped, and the zip is still kept as a download on the run's page.
name: Loot Comets release

on:
  workflow_dispatch:

concurrency:
  group: lootcomets
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: node --test pipeline/lootcomets.test.js

      - name: Stage the release
        run: bash tools/lootcomets-release.sh

      - name: Package and upload
        uses: BigWigsMods/packager@01e8631a69c69d7654c788d152630d5fed9e3812 # v2
        with:
          args: -t build/lootcomets-src
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: loot-comets
          path: build/lootcomets-src/.release/*.zip
          retention-days: 7
