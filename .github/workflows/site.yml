# Keeps the live site running:
#   every hour       the price job (EU + US) → changed files uploaded to Workers KV → the tools show them
#   once a day       rebuild the site (item and recipe pages carry prices, and Blizzard's terms say
#                    their data may be kept at most 30 days) and deploy it to Cloudflare
#   on push to main  rebuild and deploy, so code changes go live (no price job)
#   by hand          Actions → "Prices and deploy" → Run workflow
#
# Secrets (Settings → Secrets and variables → Actions): BNET_CLIENT_ID, BNET_CLIENT_SECRET,
# CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID. See docs/launch-checklist.md.
name: Prices and deploy

on:
  schedule:
    - cron: "17 * * * *" # minute 17 of every hour (GitHub may start it a few minutes late)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also rebuild and deploy the site"
        type: boolean
        default: true

# one run at a time: a run never reads ./out while another is writing it
concurrency:
  group: site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
      BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
      PRICE_JOB: ${{ github.event_name != 'push' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # ./out (price history, sales estimates, item names…) is kept between runs in GitHub's cache
      - name: Restore ./out from the last run
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: out
          key: out-${{ github.run_id }}
          restore-keys: out-

      # cache gone (first run, or GitHub dropped it): get the public files back from KV, so history survives
      - name: Download data from KV
        if: steps.restore.outputs.cache-matched-key == ''
        run: node tools/kv-sync.js pull

      - name: Price job (EU)
        id: eu
        if: env.PRICE_JOB == 'true'
        continue-on-error: true # US and the upload still run; the job is marked failed at the end
        run: node pipeline/run.js --region=eu

      - name: Price job (US)
        id: us
        if: env.PRICE_JOB == 'true'
        continue-on-error: true
        run: node pipeline/run.js --region=us

      - name: Upload changed data to KV
        if: env.PRICE_JOB == 'true'
        run: node tools/kv-sync.js push

      # daily: when the last deploy is over 20 hours old (also on push, or when run by hand with "deploy")
      - name: Is a deploy due?
        id: due
        run: |
          last=$(cat out/_deployed 2>/dev/null || echo 0)
          age=$(( $(date +%s) - last ))
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}" = "true" ] || [ "$age" -gt 72000 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; echo "Deploying (last deploy $((age / 3600)) hours ago)"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"; echo "No deploy needed (last deploy $((age / 3600)) hours ago)"
          fi

      - name: Build the site
        if: steps.due.outputs.due == 'true'
        run: npm run build

      - name: Deploy to Cloudflare
        if: steps.due.outputs.due == 'true'
        run: npx wrangler deploy && date +%s > out/_deployed

      - name: Save ./out for the next run
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: out
          key: out-${{ github.run_id }}

      - name: Report a failed price job
        if: steps.eu.outcome == 'failure' || steps.us.outcome == 'failure'
        run: |
          echo "::error::Price job failed (EU: ${{ steps.eu.outcome }}, US: ${{ steps.us.outcome }}). See its step above."
          exit 1
