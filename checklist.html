<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoW: Forever Journey Checklist — Forever Tome</title>
<meta name="description" content="Track your WoW: Forever 1–60 journey: new dungeons, zones, dual spec, Legacy and raids.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checklist">
<div id="site-header"></div>
<main>
<section class="hero page-hero"><div class="wrap">
  <div class="eyebrow">Tool</div>
  <h1>Journey checklist</h1>
  <p class="lead">Tick off Forever's new content as you level from 1 to 60 and into the raids. Your progress is saved in this browser.</p>
</div></section>
<div class="wrap section">
  <div class="panel">
    <div class="section-head" style="margin-bottom:8px"><h3 style="margin:0" id="progress-label"></h3><button class="btn btn-ghost btn-sm" id="reset-checklist">Reset</button></div>
    <div class="progress"><i id="progress-bar"></i></div>
  </div>
</div>
<div class="wrap"><div class="ad-slot" data-slot="top"></div></div>
<div class="wrap section" style="padding-top:8px">
  <div class="grid grid-2" id="checklist"></div>
  <p class="faint" style="margin-top:12px">Progress is stored only on this device. Clearing your browser data resets it.</p>
</div>
<div class="wrap"><div class="ad-slot" data-slot="bottom"></div></div>
</main>
<div id="site-footer"></div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
